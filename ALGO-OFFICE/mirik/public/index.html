<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#14121c" />
  <title>Мирик HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <div class="login-crown">👑</div>
      <h1>Мирик HQ</h1>
      <p>Офис ИИ-агентов. Вход только для босса.</p>
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />
      <button type="submit" class="btn primary">Войти в офис</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand"><span>👑</span><b>Мирик</b><em>HQ</em></div>
      <div class="crew" id="crew"></div>
      <div class="meta">
        <button class="pill clickable" id="pRunning" data-tasks="active" title="Что в работе — управление задачами"><i class="pulse"></i><b id="sRunning">0</b><span class="lbl">в работе</span></button>
        <button class="pill clickable hide-sm" id="pDone" data-tasks="done" title="Что готово"><b id="sDone">0</b><span class="lbl">готово</span></button>
        <button class="pill money" id="pBalance" title="Баланс OpenRouter — открыть бюджет">💰 <b id="sBalance">—</b><span class="lbl">баланс</span></button>
        <i id="connDot" class="conn" title="Нет соединения"></i>
      </div>
    </header>

    <main class="main">
      <section class="world" id="world">
        <canvas id="office"></canvas>
        <div class="world-tools">
          <button class="tool" data-area="ops" title="Операционный департамент">🏢</button>
          <button class="tool" data-area="yt" title="Департамент ютуберов">🎬</button>
          <button class="tool" data-area="vc" title="StartupBase — венчурный офис">💼</button>
          <button class="tool" data-z="in" title="Приблизить">+</button>
          <button class="tool" data-z="out" title="Отдалить">−</button>
          <button class="tool" data-z="fit" title="Весь офис">⤢</button>
          <button class="tool only-sm" data-z="expand" title="Развернуть офис">⇕</button>
        </div>
        <div class="world-hint" id="hint">Тяни — двигать · колесо/щипок — зум · клик по человечку — карточка</div>
        <div id="card" class="card hidden"></div>
      </section>

      <aside class="panel">
        <nav class="tabs" role="tablist">
          <button data-tab="chat" class="active">💬 Чат</button>
          <button data-tab="team">👥 Команда</button>
          <button data-tab="feed">📡 Лента <span class="badge-dot hidden" id="feedDot"></span></button>
          <button data-tab="budget">💰 Бюджет</button>
        </nav>
        <div class="views">
          <div class="view" id="v-chat"><div class="chat" id="chat"></div><button class="jump hidden" id="jump">↓ Новые</button></div>
          <div class="view hidden" id="v-team"></div>
          <div class="view hidden" id="v-feed"></div>
          <div class="view hidden" id="v-budget"><div class="empty">Загружаю…</div></div>
        </div>
        <form class="composer" id="composer">
          <div class="to" id="to"></div>
          <div class="row">
            <textarea id="msg" rows="1" placeholder="Задание для Мирика…" enterkeyhint="send"></textarea>
            <button class="send" type="submit" title="Отправить" aria-label="Отправить">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
            </button>
          </div>
        </form>
      </aside>
    </main>
  </div>
  <div id="popShade" class="pop-shade hidden"></div>
  <div id="tasksPop" class="taskpop hidden" role="dialog" aria-label="Задачи">
    <div class="taskpop-head">
      <div class="seg">
        <button data-ptab="active">⏳ В работе <b id="popActiveN">0</b></button>
        <button data-ptab="done">✅ Готово <b id="popDoneN">0</b></button>
      </div>
      <button class="x" data-popclose aria-label="Закрыть">✕</button>
    </div>
    <div class="taskpop-body" id="tasksPopBody"></div>
  </div>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
