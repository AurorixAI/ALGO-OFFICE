app = "mirik-hq"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  MODEL = "z-ai/glm-5.3-flash"

[[mounts]]
  source = "mirik_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Бот работает через long polling — машина должна быть всегда включена
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
